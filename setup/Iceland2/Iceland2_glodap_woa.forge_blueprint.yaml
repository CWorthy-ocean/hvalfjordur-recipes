# Iceland2_glodap_woa: Iceland2 (MARBL), Feb 2023 to Dec 2024, nested in the
# Iceland1_glodap_woa run (workplan_runs/iceland1_glodap_woa). Run with
# wp_Iceland2_glodap_woa.yaml.
#
# Derived by hand from Iceland2_NEW_customriver_Iceland2_NEW_256procs.forge_blueprint.yaml:
# same grid, run window, surface, restoring and tidal forcing, MARBL settings and output.
# Changes:
#   - river forcing: the rebuilt GloFAS + Hvalfjordur file (Iceland2_river_forcing.ipynb)
#   - ucla-roms: the constant_Fe branch, which reads up to 1000 forcing files
#     (max_frc_files, since fc2b6d84; 360 before) and accepts the namelist C-Star
#     writes for it. Pin the branch name, not a commit: Forge writes the namelist
#     for the newest ucla-roms layout (0.9+) for any ref that is not a release tag,
#     but at run time C-Star maps a commit to the release it descends from (0.8.0)
#     and rejects that namelist. Every step builds the branch tip, so don't push
#     to constant_Fe while this workplan runs
#   - pio_stride 64 (one PIO I/O task per 64-core node)
#   - output (all snapshots):
#       history, hourly:     zeta, ubar, vbar, u, v, one file per day (was daily, with w);
#                            hourly zeta for the tide-gauge comparison. Temperature and
#                            salinity come from the daily restarts.
#       averages:            off (the 10-minute u, v, w averages)
#       BGC tracers, daily:  PO4, NO3, SiO3, NH4, Fe, O2, DIC, ALK, spChl, diatChl,
#                            spC, diatC, DOC (unchanged)
#       BGC diagnostics, daily: PH (surface), pH_3D (added), pCO2SURF, FG_CO2,
#                            calcToSed, photoC_sp, photoC_dia; the _ALT_CO2
#                            diagnostics dropped (no OAE in this run)
#       restarts daily (2 per file) and Iceland3 boundary extraction every 30 min,
#       unchanged
#     composition.overrides records the same edits
#   - provenance.content_hash cleared (this file is hand-edited)
# Boundary forcing is not set here: each workplan step's nest-from directive supplies
# Iceland1's child_bry files.
#
# The grid, surface, restoring and tidal inputs are not regenerated: link_forge_inputs.sh
# hard-links them from the custom-river forge run before forge runs, and forge reuses
# files that are already in input_data/. Never run this blueprint with --clobber.
