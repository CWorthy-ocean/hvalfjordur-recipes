# yaml-language-server: $schema=https://raw.githubusercontent.com/CWorthy-ocean/C-Star/refs/heads/main/docs/schemas/wp/workplan_schema.1.0.0.json
#
# Iceland2_glodap_woa: Iceland2 (MARBL), 2023-02-01 to 2024-12-31, nested in the finished
# Iceland1_glodap_woa run (/anvil/scratch/x-uheede/cstar/workplan_runs/iceland1_glodap_woa).
#
# Steps
#   nest_conversion  Iceland1's 2023-02-01 restart interpolated onto the Iceland2 grid
#   spin-up          2023-02-01 to 2023-02-15, dt 10 s, 12 h wall clock
#   segment1         2023-02-15 to 2023-07-01, dt 25 s, 48 h wall clock
#   segment2         2023-07-01 to 2024-01-01
#   segment3         2024-01-01 to 2024-07-01
#   segment4         2024-07-01 to 2024-12-31 (Iceland1 stops at 2024-12-31 00:00)
# The custom-river run used dt 15 s (the blueprint's value) and 10 s for its spin-up.
# Every ROMS step: 4 nodes x 64 cores (16 x 16 tiles), pio_stride 64 (set in the blueprint),
# Anvil allocation EES260142.
#
# Boundaries: each step reads its own folder under child_bry_by_step/, filled by
# gather_child_bry.py with symlinks to the step's share of Iceland1's child_bry files
# (about 370 for six months). C-Star hands ROMS every file in the folder, and this
# ucla-roms build reads at most 1000 forcing files; all of Iceland1's files are about 1400.
#
# Grid: the custom-river run's grid, which Iceland2_river_forcing.ipynb also used. It is
# set as child_grid in nest_conversion and with a grid override in each ROMS step. The
# grid forge writes for this blueprint has NaN depths in its top 4 rows; see the note in
# wp_Iceland2_10min_velocity.yaml.
#
# Before running
#   1. run Iceland2_river_forcing.ipynb (writes the river file), bash link_forge_inputs.sh --link,
#      then forge Iceland2_glodap_woa.forge_blueprint.yaml (it writes the run blueprint below
#      and stages the new river file)
#   2. python gather_child_bry.py wp_Iceland2_glodap_woa.yaml <child_bry_merged> <Iceland1 year2023 output> <year2024 output>
#   3. python check_nest_bracketing.py wp_Iceland2_glodap_woa.yaml
#   4. cstar workplan check wp_Iceland2_glodap_woa.yaml
name: Iceland2_glodap_woa
description: Iceland2 (MARBL) 2023-2024 nested in Iceland1_glodap_woa for initial and boundary conditions
state: draft

steps:
  - name: nest_conversion_Iceland1_Iceland2
    application: nest_ic
    blueprint: /anvil/projects/x-ees250129/cstar-forge-data/catalog/workplans/nest_ic_bp.yaml
    blueprint_overrides:
      parent_grid: /anvil/scratch/x-uheede/cstar/blueprint_runs/forge/iceland1_256procs/input_data/Iceland1_256procs_grid.nc
      parent_rst: /anvil/scratch/x-uheede/cstar/workplan_runs/iceland1_glodap_woa/tasks/year2023/output/output_rst.20230201000000.nc
      child_grid: &GRID_FILE /anvil/scratch/x-uheede/cstar/_forge_bp_runs/Iceland2_NEW_customriver_Iceland2_NEW_256procs/input_data/Iceland2_NEW_customriver_Iceland2_NEW_256procs_grid.nc
    compute_overrides:
      slurm:
        account_name: &ACCOUNT ees260142

  - name: spin-up
    application: roms_marbl
    blueprint: &BPURI /anvil/scratch/x-uheede/cstar/_forge_bp_runs/Iceland2_glodap_woa/blueprints/B_Iceland2_glodap_woa.yaml
    blueprint_overrides:
      runtime_params:
        start_date: "2023-02-01 00:00:00"
        end_date: "2023-02-15 00:00:00"
      namelist_overrides:
        time_stepping:
          dt: 10
      grid: &GRID
        data:
          - location: *GRID_FILE
    directives:
      continue-from:
        step: nest_conversion_Iceland1_Iceland2
      nest-from:
        path: /anvil/scratch/x-uheede/cstar/workplan_runs/iceland1_glodap_woa/child_bry_by_step/spin-up
    compute_overrides:
      slurm:
        max_walltime: "12:00:00"
        num_nodes: &NODES 4                # 16 x 16 = 256 ranks / 64 per node
        cpus_per_node: &CPUS_PER_NODE 64
        account_name: *ACCOUNT
    depends_on:
    - nest_conversion_Iceland1_Iceland2

  - name: segment1
    application: roms_marbl
    blueprint: *BPURI
    blueprint_overrides:
      runtime_params:
        start_date: "2023-02-15 00:00:00"
        end_date: "2023-07-01 00:00:00"
      grid: *GRID
      namelist_overrides: &DT
        time_stepping:
          dt: 25
    directives:
      continue-from:
        step: spin-up
      nest-from:
        path: /anvil/scratch/x-uheede/cstar/workplan_runs/iceland1_glodap_woa/child_bry_by_step/segment1
    compute_overrides: &SEGMENT_COMPUTE
      slurm:
        max_walltime: "48:00:00"
        num_nodes: *NODES
        cpus_per_node: *CPUS_PER_NODE
        account_name: *ACCOUNT
    depends_on:
    - spin-up

  - name: segment2
    application: roms_marbl
    blueprint: *BPURI
    blueprint_overrides:
      runtime_params:
        start_date: "2023-07-01 00:00:00"
        end_date: "2024-01-01 00:00:00"
      grid: *GRID
      namelist_overrides: *DT
    directives:
      continue-from:
        step: segment1
      nest-from:
        path: /anvil/scratch/x-uheede/cstar/workplan_runs/iceland1_glodap_woa/child_bry_by_step/segment2
    compute_overrides: *SEGMENT_COMPUTE
    depends_on:
    - segment1

  - name: segment3
    application: roms_marbl
    blueprint: *BPURI
    blueprint_overrides:
      runtime_params:
        start_date: "2024-01-01 00:00:00"
        end_date: "2024-07-01 00:00:00"
      grid: *GRID
      namelist_overrides: *DT
    directives:
      continue-from:
        step: segment2
      nest-from:
        path: /anvil/scratch/x-uheede/cstar/workplan_runs/iceland1_glodap_woa/child_bry_by_step/segment3
    compute_overrides: *SEGMENT_COMPUTE
    depends_on:
    - segment2

  - name: segment4
    application: roms_marbl
    blueprint: *BPURI
    blueprint_overrides:
      runtime_params:
        start_date: "2024-07-01 00:00:00"
        end_date: "2024-12-31 00:00:00"
      grid: *GRID
      namelist_overrides: *DT
    directives:
      continue-from:
        step: segment3
      nest-from:
        path: /anvil/scratch/x-uheede/cstar/workplan_runs/iceland1_glodap_woa/child_bry_by_step/segment4
    compute_overrides: *SEGMENT_COMPUTE
    depends_on:
    - segment3
