# yaml-language-server: $schema=https://raw.githubusercontent.com/CWorthy-ocean/C-Star/refs/heads/main/docs/schemas/wp/workplan_schema.1.0.0.json
#
# Iceland3 OAE member ENS5 (CDR5 in the analysis notebooks): the November 2024 Iceland3 run
# (iceland3-nov2024, wp_Iceland3_corr.yaml) from its 2024-11-06 00:00 restart, with the ENS5
# alkalinity release of CDR_forcing_creation.ipynb, for 14 days (2024-11-06 to 2024-11-20).
#
# Release: 0.0005 m3/s of water at 10 C, salinity 1 and ALK 1,180,000 meq/m3, at 64.394 N,
# 21.466 W, 2 m deep. The forcing records with that flux are 2024-11-09 06:00 to 11-12 06:00; ROMS ramps
# linearly between records. 172.8 m3 and about 2.0e5 mol of alkalinity in all.
#
# The run blueprint, boundaries, time step, partitioning and compute are those of iceland3-nov2024.
# The overrides below add the release and its output:
#   - code.compile_time: the November build's compile-time folder with CDR_FORCING defined,
#     written by make_cdr_build.py (a workplan cannot add a cppdef any other way)
#   - cdr_forcing: the 14-day ENS5 file from the "November members for the C-Star runs" section of
#     CDR_forcing_creation.ipynb; it holds 15 days, since ROMS stops once model time passes the
#     last record of a forcing file
#   - cdr_frc_settings: CDR forcing on; a volume release (cdr_volume) at the file's location
#     (parameterized), interpolated linearly in time. The linear ramp matches the release start
#     times in oae_analysis.ipynb (48-54 h into each run).
#   - cdr_output_settings: the CDR output stream on, hourly averages, 24 per file. This is the
#     "cstar" stream of the earlier runs (ALK_source and the other *_source fields, FG_CO2 and
#     FG_ALT_CO2, int_z_ALK, ...); ucla-roms now writes it to <root>_cdr.*.nc
#   - marbl_biogeochemistry_settings: the BGC output lists, set in full. The tracers add
#     ALK_ALT_CO2 and DIC_ALT_CO2 and the diagnostics pH_3D, which OAE_ensemble.ipynb reads;
#     the diagnostics also add CO3, CO3_ALT_CO2, co3_sat_arag, co3_sat_calc, zsatarag and
#     zsatcalc, without which the CDR output stops ROMS at startup
#
# Before running (once for ENS4-6):
#   1. run the "November members for the C-Star runs" section of CDR_forcing_creation.ipynb
#   2. python make_cdr_build.py /anvil/scratch/x-uheede/Iceland3_corrected/blueprint/B_Iceland3_256procs_anvil.yaml \
#          /anvil/scratch/x-uheede/iceland3_oae_nov2024/compile-time-cdr
#   3. check that the restart under continue-from exists, and compare the BGC output lists below
#      with the ones in that run blueprint
#
# Check and run:
#   cstar workplan check wp_Iceland3_oae_ens5.yaml
#   cstar workplan run   wp_Iceland3_oae_ens5.yaml --run-id iceland3-oae-ens5
name: iceland3-oae-ens5
description: Iceland3 OAE member ENS5 (CDR5), 2024-11-06 to 2024-11-20, branched from iceland3-nov2024
state: draft

compute_environment:
  launcher: slurm
  system: anvil

steps:
  - name: ens5
    application: roms_marbl
    blueprint: /anvil/scratch/x-uheede/Iceland3_corrected/blueprint/B_Iceland3_256procs_anvil.yaml
    blueprint_overrides:
      runtime_params:
        start_date: "2024-11-06T00:00:00"
        end_date: "2024-11-20T00:00:00"
      code:
        compile_time:
          location: /anvil/scratch/x-uheede/iceland3_oae_nov2024/compile-time-cdr
      cdr_forcing:
        data:
          - location: /anvil/scratch/x-uheede/iceland3_oae_nov2024/Iceland3_cdr_forcing_ENS5_14d.nc
      namelist_overrides:
        cdr_frc_settings:
          cdr_source: true
          cdr_volume: true
          cdr_ncdr_parm: 1
          cdr_forcing_parameterized: true
          cdr_forcing_depth_profiles: false
          cdr_forcing_3d: false
          cdr_time_interpolation: true
          cdr_relocate_to_wet_pts: true
        cdr_output_settings:
          do_cdr_output: true
          wrt_cdr_avg: true
          cdr_monthly_averages: false
          output_period_cdr: 3600
          nrpf_cdr: 24
        marbl_biogeochemistry_settings:
          marbl_tracers_to_write: [PO4, NO3, SiO3, NH4, Fe, O2, DIC, DIC_ALT_CO2, ALK, ALK_ALT_CO2, spChl, diatChl]
          marbl_diagnostics_to_write: [PH, PH_ALT_CO2, pH_3D, pCO2SURF, pCO2SURF_ALT_CO2, FG_CO2, FG_ALT_CO2,
                                       CO3, CO3_ALT_CO2, co3_sat_arag, co3_sat_calc, zsatarag, zsatcalc]
    directives:
      continue-from:
        path: /anvil/scratch/x-uheede/cstar/workplan_runs/iceland3-nov2024/tasks/iceland3/output/output_rst.20241106000000.nc
      nest-from:
        path: /anvil/scratch/x-uheede/Iceland2_corrected/bry_files
    compute_overrides:
      slurm:
        account_name: ees260142
        queue_name: wholenode
        num_cpus: 256
        num_nodes: 4
        cpus_per_node: 64
        max_walltime: "24:00:00"
